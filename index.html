<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F3EE">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>单词营地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a camp trail — home is the trail map of units, each unit is a column of numbered stations (easy → hard), each station a chunky tactile game screen. */
:root{
  --bg:#E9F3EE; --surface:#FFFFFF; --surface-2:#F2F8F4; --line:#C9DDD2;
  --ink:#16382C; --ink-soft:#557367;
  --pine:#1F7A55; --pine-deep:#155C3F; --on-pine:#FFFFFF;
  --sun:#FFC83D; --sun-deep:#D9A21A; --sun-ink:#4A3300;
  --coral:#E8644E; --coral-deep:#B9442F; --sky:#3D8FD6; --chunk-b:#C04A33; --sky-bg:#D4E9F6;
  --good:#23894E; --good-bg:#D9F2E2; --bad:#C9402F; --bad-bg:#FBE1DC;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --word:"Andika","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1D17; --surface:#162D25; --surface-2:#1B372D; --line:#2C4B3F;
  --ink:#E5F2EB; --ink-soft:#A1BCB0;
  --pine:#4CC08A; --pine-deep:#2E8A5F; --on-pine:#06261A;
  --sun:#FFC83D; --sun-deep:#C99415; --sun-ink:#3A2800;
  --coral:#FF8A72; --coral-deep:#C9563F; --sky:#6CB2EE; --chunk-b:#FF9580; --sky-bg:#16303F;
  --good:#5FD39A; --good-bg:#1C4334; --bad:#FF8E7C; --bad-bg:#4A2520;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1D17; --surface:#162D25; --surface-2:#1B372D; --line:#2C4B3F;
  --ink:#E5F2EB; --ink-soft:#A1BCB0;
  --pine:#4CC08A; --pine-deep:#2E8A5F; --on-pine:#06261A;
  --sun:#FFC83D; --sun-deep:#C99415; --sun-ink:#3A2800;
  --coral:#FF8A72; --coral-deep:#C9563F; --sky:#6CB2EE; --chunk-b:#FF9580; --sky-bg:#16303F;
  --good:#5FD39A; --good-bg:#1C4334; --bad:#FF8E7C; --bad-bg:#4A2520;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.word{font-family:var(--word)}
.muted{color:var(--ink-soft)}

/* buttons: tactile, pressable */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:800;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pine);border-color:var(--pine-deep);box-shadow:0 4px 0 var(--pine-deep);color:var(--on-pine)}
.btn.primary:active{box-shadow:0 1px 0 var(--pine-deep)}
.btn.sun{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 4px 0 var(--sun-deep);color:var(--sun-ink)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}

.topbar{display:flex;align-items:center;gap:10px;min-height:52px}
.topbar .title{flex:1;min-width:0;font-family:var(--display);font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
button.chip{cursor:pointer}
.chip .star{color:var(--sun-deep)}

/* home */
.panel{background:var(--sky-bg);border-radius:28px;padding:18px 18px 16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px 8px;margin-top:4px}
.hero .stats{grid-column:1/-1}
.lesson-head{display:flex;align-items:center;gap:12px}
.lesson-head h1{font-size:clamp(36px,9vw,50px);font-weight:800}
.hero-text{flex:1;min-width:0}
.eyebrow{margin:0 0 2px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--pine)}
.hero h1{font-size:clamp(40px,11vw,58px);font-weight:800;color:var(--ink);letter-spacing:.02em}
.lede{margin:4px 0 0;color:var(--ink-soft)}
.hero-art{width:clamp(110px,28vw,170px);flex:none}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.sec{font-size:22px;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--body);font-size:14px;color:var(--ink-soft);font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.unit{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 4px 8px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);cursor:pointer}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.u-badge{width:44px;height:44px;border-radius:14px;font-size:22px!important;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:800;box-shadow:inset 0 -4px 0 var(--sun-deep)}
.u-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.u-title{font-family:var(--display);font-size:18px;font-weight:800;line-height:1.1}
.u-stars{font-weight:800;font-size:14px;white-space:nowrap}
.u-stars .star{color:var(--sun-deep)}
.u-stars small{font-size:12px;color:var(--ink-soft)}
.coming{grid-column:1/-1;padding:12px 16px;border-radius:16px;border:2px dashed var(--line);color:var(--ink-soft);font-size:14px;font-weight:700}
.u-meta{font-size:14px;color:var(--ink-soft);font-weight:700}
.u-emojis{font-size:22px;letter-spacing:2px}
.unit.locked{cursor:default;background:transparent;box-shadow:none;border-style:dashed;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px}
.stickers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sticker{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:clamp(24px,7vw,36px);border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.sticker.off{filter:grayscale(1);opacity:.3;border-style:dashed;background:transparent}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-soft)}

/* unit */
.unit-head{display:flex;flex-direction:column;gap:6px}
.unit-head h1{font-size:clamp(34px,8vw,48px)}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;color:var(--ink-soft)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.wordchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:12px;background:var(--surface);border:2px solid var(--line);cursor:pointer;font-family:var(--word);font-size:16px}
.wchip.extra{border-style:dashed;color:var(--ink-soft)}
.legend{font-size:13px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:10px;border:2px solid var(--line);border-radius:4px;margin-right:6px;vertical-align:-1px}
.legend span.ex::before{border-style:dashed}
.acts{display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}
.station{position:relative}
.station:not(:last-child)::after{content:"";position:absolute;left:32px;top:calc(100% + 4px);height:10px;border-left:4px dotted var(--ink-soft);opacity:.45}
.act-row{width:100%;display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);cursor:pointer}
.act-row:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.act-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--pine);background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line)}
.done .act-n{background:var(--pine);color:var(--on-pine);box-shadow:none}
.next .act-n{background:var(--sun);color:var(--sun-ink);box-shadow:none}
.next .act-row{border-color:var(--sun-deep);box-shadow:0 4px 0 var(--sun-deep)}
.next-tag{font-style:normal;font-size:11px;font-weight:800;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--sun);color:var(--sun-ink);vertical-align:2px}
.ring{position:relative;width:78px;height:78px;flex:none;margin-left:auto}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--surface);stroke-width:8}
.ring-fg{fill:none;stroke:var(--sun-deep);stroke-width:8;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--display);font-size:24px}
.ring small{font-size:11px;font-weight:800;color:var(--ink-soft)}
.words{border-radius:18px}
.words summary{cursor:pointer;font-weight:800;font-size:15px;padding:4px 0 10px;list-style:none}
.words summary::-webkit-details-marker{display:none}
.words summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .2s;color:var(--pine)}
.words[open] summary::before{transform:rotate(90deg)}
.words summary small{font-weight:700;color:var(--ink-soft);margin-left:4px}
.act-ic{font-size:28px;text-align:center}
.act-txt b{display:block;font-size:17px}
.act-txt small{color:var(--ink-soft);font-size:13px}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .on{color:var(--sun-deep)}
.stars .off{color:var(--line)}
.group-label{font-family:var(--display);font-size:20px;font-weight:800;margin:6px 0 -4px}
.note{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:2px dashed var(--line);font-size:14px;color:var(--ink-soft)}

/* game common */
.progress{height:10px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.progress>i{display:block;height:100%;min-width:10px;background:var(--pine);border-radius:99px;transition:width .3s}
.stage.bare{background:none;border:0;padding:4px 0}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:18px 14px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.q-label{margin:0;font-weight:800;color:var(--ink-soft)}
.q-word{font-size:clamp(40px,11vw,60px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.q-emoji{font-size:64px;line-height:1}
.q-cn{font-size:28px;font-weight:800}
.big-say{width:96px;height:96px;border-radius:50%;font-size:40px;background:var(--sun);border:3px solid var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);cursor:pointer}
.big-say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.link{background:none;border:0;color:var(--sky);font-weight:800;cursor:pointer;padding:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{min-height:64px;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);cursor:pointer;font-weight:800;font-size:17px;overflow-wrap:anywhere}
.opt .word{font-size:22px;font-weight:700}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{animation:bump .35s;background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt[disabled]{cursor:default}
.feedback{min-height:28px;font-weight:800;font-size:18px;margin:0}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bump{50%{transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

/* flashcard */
.flash{width:100%;max-width:420px;height:clamp(330px,88vw,370px);perspective:1200px;background:none;border:0;padding:0;cursor:pointer;display:block}
.flash-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.flash-inner.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:24px;background:var(--surface);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.face .emo{font-size:clamp(46px,13vw,66px);line-height:1}
.face .word{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.face .ipa{font-size:18px;color:var(--ink-soft);font-family:"Andika","Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.face .cn{font-size:clamp(26px,7vw,34px);font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;border:2px solid var(--line);color:var(--ink-soft)}
.tag.core{border-color:var(--pine);color:var(--pine)}
.tap-tip{font-size:13px;color:var(--ink-soft);margin:0}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:420px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.k{background:var(--pine)}
.dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.known-on{background:var(--good-bg)!important;border-color:var(--good)!important;box-shadow:0 4px 0 var(--good)!important}

/* spelling */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 20px}
.slot-group{display:flex;gap:6px}
.slots{--sw:min(42px,calc((100vw - 96px) / var(--n,8) - 6px))}
.slot{width:var(--sw);height:calc(var(--sw) * 1.24);border:0;border-bottom:4px solid var(--ink-soft);background:var(--surface-2);border-radius:10px 10px 4px 4px;font-family:var(--word);font-size:calc(var(--sw) * .7);font-weight:700;cursor:pointer;padding:0}
.slot.fixed{display:grid;place-items:center;background:none;border-color:transparent;color:var(--ink-soft);cursor:default;width:auto;min-width:10px}
.slot.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.slot.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:50px;height:54px;border-radius:14px;border:2px solid var(--sun-deep);background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-deep);font-family:var(--word);font-size:28px;font-weight:700;cursor:pointer}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.tile.used{visibility:hidden}

/* dictation + fill */
.dict-form{display:flex;gap:8px;width:100%;max-width:460px}
.dict-in{flex:1;min-width:0;font-family:var(--word);font-size:26px;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--surface-2);color:var(--ink)}
.dict-in:focus{outline:none;border-color:var(--sky)}
.dict-in.ok{border-color:var(--good);background:var(--good-bg)}
.dict-in.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.hint-letters{font-size:26px;letter-spacing:2px;margin:0;color:var(--ink-soft)}
.answer{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:18px;background:var(--surface-2);border:2px solid var(--line);font-weight:800;font-size:18px}
.answer .word{font-size:34px;font-weight:700}
.fill-sent{font-size:clamp(23px,6.5vw,32px);line-height:1.6;margin:0}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--ink-soft);margin:0 4px;line-height:1.2}
.blank.filled.ok{color:var(--good);border-color:var(--good)}

/* sentences */
.sents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 10px 10px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.sent.done{border-color:var(--good)}
.sent-text{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;text-align:left;background:none;border:0;padding:4px;border-radius:12px;cursor:pointer;min-width:0}
.sent-text:active{background:var(--surface-2)}
.play{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--sun);color:var(--sun-ink);margin-top:3px}
.sent.done .play{background:var(--good);color:var(--surface);font-size:15px;font-weight:800}
.sent-words{display:flex;flex-direction:column;min-width:0}
.sent .en{font-family:var(--word);font-size:20px;line-height:1.45}
.sent .cn{margin-top:2px;color:var(--ink-soft);font-size:15px}
.sent mark{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 3px}
.sent-btns{display:flex;gap:6px}
.sent .icon-btn{width:42px;height:42px}
.icon-btn{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.check{color:var(--good);font-weight:800}

/* word order */
.line{min-height:70px;width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:10px;border-radius:16px;border:2px dashed var(--line);background:var(--surface-2)}
.line.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.wtok{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-family:var(--word);font-size:21px;font-weight:700;cursor:pointer}
.wtok.bank{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 3px 0 var(--sun-deep);color:var(--sun-ink)}
.wtok.used{visibility:hidden}
.wtok.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.line-hint{color:var(--ink-soft);font-size:14px}

/* result */
.result{padding:28px 16px}
.big-stars{font-size:64px;letter-spacing:6px;line-height:1}
.big-stars span{display:inline-block;animation:pop .5s both}
.big-stars span:nth-child(2){animation-delay:.15s}
.big-stars span:nth-child(3){animation-delay:.3s}
.big-stars .on{color:var(--sun)}
.big-stars .off{color:var(--line)}
.new-sticker{font-size:16px;font-weight:800;padding:10px 16px;border-radius:14px;background:var(--surface-2);border:2px solid var(--sun-deep)}

/* mistakes */
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mitem{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.mitem .e{font-size:28px;text-align:center}
.mitem .word{font-size:20px;font-weight:700}
.mitem small{display:block;color:var(--ink-soft)}
.miss-n{font-size:13px;font-weight:800;color:var(--bad)}
.empty{text-align:center;padding:30px 16px;color:var(--ink-soft)}
.empty .big{font-size:48px}

.sp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.sp-w{display:flex;gap:3px}
.chunk{display:flex;flex-direction:column;align-items:center;padding:2px 6px;border-radius:8px;background:var(--surface-2);line-height:1.2}
.face.back .chunk,.answer .chunk{background:var(--surface)}
.chunk b{font-family:var(--word);font-size:22px;font-weight:700}
.chunk.c0 b{color:var(--pine)}
.chunk.c1 b{color:var(--chunk-b)}
.chunk i{font-style:normal;font-size:12px;color:var(--ink-soft);font-family:"Andika","Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.settings{display:flex;flex-direction:column;gap:6px}
.switch-row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:9px 12px 9px 14px;border-radius:14px;font-weight:800;font-size:14px;background:var(--surface);border:2px solid var(--line);cursor:pointer}
.sw-txt{white-space:nowrap;font-size:16px;font-weight:800}
.sw-sub{flex:1;min-width:0;font-size:13px;font-weight:400;color:var(--ink-soft);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{flex:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--pine)}
.switch.on i{transform:translateX(16px)}
.mix{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:14px;border-radius:20px;border:2px solid var(--line);background:var(--surface)}
.mix-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--ink-soft)}
.mix-head b{color:var(--ink);font-variant-numeric:tabular-nums}
.mixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.mixchip{height:40px;padding:0;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:var(--display);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.mixchip.on{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.mix-go{align-self:flex-start}
.cn-btn{font-weight:800;font-size:17px}
.cn-btn.on{background:var(--sun);border-color:var(--sun-deep);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-deep)}
.wtok.ref{cursor:default;box-shadow:none;background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.fill-ans{font-size:22px;font-weight:700}

.u-sub{font-family:var(--word);font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-title{margin:2px 0 0;font-family:var(--word);font-weight:700;font-size:17px;color:var(--pine)}
.rules{border-radius:16px;background:var(--surface);border:2px solid var(--line);padding:10px 14px}
.rules summary{cursor:pointer;font-weight:800;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-soft)}
/* flashcard example */
.ex-label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--pine)}
.face .ex-en{font-size:clamp(18px,5vw,22px);font-weight:700;line-height:1.45;max-width:30ch}
.ex-en mark,.sent mark{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 3px}
.mean{display:flex;flex-direction:column;align-items:center;gap:4px}
.mean[hidden]{display:none}
.mean .cn{font-size:clamp(22px,6.4vw,28px)}
.ex-cn{font-size:15px;color:var(--ink-soft)}
.tap-more{font-size:13px;font-weight:800;color:var(--sky)}

.who{align-self:flex-start;font-size:12px;font-weight:800;color:var(--sky);margin-bottom:1px}
.tk{border-radius:6px;padding:0 1px;cursor:pointer;transition:background .12s,color .12s}
.tk.kw{background:var(--sun);color:var(--sun-ink);padding:0 3px}
.tk.on{background:var(--pine);color:var(--on-pine)}
.cn.big{font-size:19px;font-weight:800;color:var(--ink)!important;margin:0!important}
.hint-say{font-size:13px;color:var(--ink-soft)}
.sent-btns{align-self:center}
.anchor{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px;border-radius:24px;background:var(--sky-bg)}

.anchor .word{font-size:clamp(30px,8.5vw,42px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.anchor .ipa{color:var(--ink-soft);font-size:15px;font-family:"Andika","Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.anchor .cn{font-weight:800;font-size:17px}
.anchor .big-say{width:64px;height:64px;font-size:28px}
.who.extra{color:var(--ink-soft)}
.btn.toggle-on{background:var(--good-bg);border-color:var(--pine);box-shadow:0 4px 0 var(--pine)}
.read-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.read-bar .tap-tip{flex:1 1 220px;text-align:left}
.hero .stats{flex-wrap:nowrap;gap:6px}
.hero .chip{font-size:13px;padding:5px 10px}
.today{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.today.has{border-color:var(--sun-deep);box-shadow:0 3px 0 var(--sun-deep)}
.today-ic{font-size:20px;line-height:1;flex:none}
.today-txt{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:14px;color:var(--ink-soft)}
.today-txt b{font-family:var(--display);font-size:17px;color:var(--ink)}
.today-meta{font-size:12px;opacity:.85}
.today .btn{flex:none;min-height:38px;padding:4px 14px;font-size:14px}
.lesson-bar{display:flex;flex-direction:column;line-height:1.15}
.lesson-bar b{font-size:22px;overflow:hidden;text-overflow:ellipsis}

.unit .u-title{display:none}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;z-index:60;max-width:calc(100% - 32px);text-align:center}

"6":{"title": "Double Ninth Festival for Elders", "sentences": [["课文 · 第19页"], ["Sara", "Hello, Lingling! What's in your hands?", "你好，玲玲！你手里拿的是什么？"], ["Lingling", "Hi, Sara! Here are some Chongyang cakes for my grandparents.", "你好，萨拉！这是给我爷爷奶奶的重阳糕。"], ["Lingling", "I'm going to visit them.", "我要去看望他们。"], ["Lingling", "Today is the Double Ninth Festival.", "今天是重阳节。"], ["Sara", "What is the Double Ninth Festival for?", "重阳节是为了什么？"], ["Lingling", "It's a festival for elders.", "它是老人的节日。"], ["Lingling", "It's on the ninth day of the ninth month in the Chinese calendar.", "在农历九月初九。"], ["Lingling", "We also call it Chongyang Festival.", "我们也叫它重阳节。"], ["Sara", "Is there any special meaning?", "有什么特别的含义吗？"], ["Lingling", "Yes. In Chinese, the number \"nine\" sounds like the word \"long time\".", "有。在汉语里，“九”听起来像“久”。"], ["Lingling", "So \"double ninth\" here means a wish of long life for elders.", "所以“重九”在这里表示祝愿老人长寿。"], ["Sara", "What do you do on the Double Ninth Festival?", "重阳节你们做什么？"], ["Lingling", "Young people always do something for elders to show love and care.", "年轻人总会为老人做些事，表达爱和关心。"], ["Sara", "Sounds interesting.", "听起来很有意思。"], ["练一练 · 第20–21页"], ["", "What can they do on the Double Ninth Festival?", "重阳节他们可以做什么？"], ["", "Please choose the best choice.", "请选出最好的选项。"], ["", "Lily's grandma can't wash her clothes, so Lily can wash clothes for her.", "莉莉的奶奶没法洗衣服，所以莉莉可以帮她洗。"], ["", "Lucy's grandma is old, so Lucy takes care of her.", "露西的奶奶年纪大了，所以露西照顾她。"], ["", "Tom's grandpa likes eating cakes, so Tom buys cakes for him.", "汤姆的爷爷喜欢吃蛋糕，所以汤姆给他买蛋糕。"], ["", "Cici's grandpa likes playing chess, so Cici plays chess with him.", "茜茜的爷爷喜欢下棋，所以茜茜陪他下棋。"], ["", "What do you do on the Double Ninth Festival?", "重阳节你做什么？"], ["", "This is the Double Ninth Festival.", "这是重阳节。"], ["", "It's on the ninth day of the ninth month in the Chinese calendar.", "在农历九月初九。"]]},
"7":{"title": "Tomb-sweeping Day for Memory", "sentences": [["课文 · 第22页"], ["Sara", "Dear Lucy, I'm learning about traditional Chinese festivals.", "亲爱的露西，我正在学习中国传统节日。"], ["Sara", "Let me tell you a special one: Tomb-sweeping Day.", "我给你讲一个特别的节日：清明节。"], ["Sara", "It mostly falls on the 4th or 5th in April.", "它大多在四月四日或五日。", "It mostly falls on the fourth or fifth in April."], ["Sara", "It's a festival to remember the dead.", "它是纪念逝者的节日。"], ["Sara", "On that day, people usually sweep tombs of their family members and national heroes.", "那一天，人们通常为家人和民族英雄扫墓。"], ["Sara", "Now Tomb-sweeping Day is a public holiday.", "现在清明节是公共假日。"], ["Sara", "People like to go outing on this day.", "人们喜欢在这一天去郊游。"], ["Sara", "In the south of China, people like to eat qingtuan on that day.", "在中国南方，人们喜欢在这一天吃青团。"], ["Sara", "Qingtuan is a kind of sweet green rice ball.", "青团是一种甜甜的绿色米团。"], ["Sara", "Would you like to know more about traditional Chinese festivals?", "你想多了解中国传统节日吗？"], ["Sara", "Please write me an email! Best wishes, Sara.", "请给我写邮件！祝好，萨拉。"], ["练一练 · 第23–24页"], ["", "When is it? What's it for? What do people do?", "它在什么时候？为了什么？人们做什么？"], ["", "Tomb-sweeping Day mostly falls on the 4th or 5th in April each year.", "清明节大多在每年四月四日或五日。", "Tomb-sweeping Day mostly falls on the fourth or fifth in April each year."], ["", "Choose a festival and talk about it.", "选一个节日说一说。"], ["", "Please write an email about a traditional Chinese festival to Lucy.", "请给露西写一封关于中国传统节日的邮件。"], ["", "Let me tell you a traditional Chinese festival.", "我给你讲一个中国传统节日。"], ["", "Would you like to know more about it? Please write me an email.", "你想多了解一些吗？请给我写邮件。"]]},
"8":{"title": "Solar Terms and Our Life", "sentences": [["课文 · 第25页"], ["", "There are 24 solar terms in the traditional Chinese calendar.", "中国传统历法中有二十四个节气。", "There are twenty-four solar terms in the traditional Chinese calendar."], ["", "Here are the beginning solar terms of each season.", "这里是每个季节开始的节气。"], ["立春", "Beginning of Spring: It is getting warm.", "立春：天气变暖了。"], ["立春", "It's time to plant crops in many places.", "很多地方到了种庄稼的时候。"], ["立春", "On that day, people in North China like to eat chunbing.", "那一天，北方人喜欢吃春饼。"], ["立夏", "Beginning of Summer: After that day, it gets hot quickly.", "立夏：这天以后，天气很快变热。"], ["立夏", "It's time for crops to grow.", "庄稼开始生长了。"], ["立夏", "People in different parts of China eat different food for good luck.", "中国各地的人吃不同的食物，祈求好运。"], ["立秋", "Beginning of Autumn: It is getting cool.", "立秋：天气变凉了。"], ["立秋", "It's time to harvest crops.", "到了收庄稼的时候。"], ["立秋", "People like to eat meat to keep strong.", "人们喜欢吃肉，让身体强壮。"], ["立冬", "Beginning of Winter: After that day, it gets cold quickly.", "立冬：这天以后，天气很快变冷。"], ["立冬", "It's time to store up crops.", "到了储存粮食的时候。"], ["立冬", "People eat jiaozi on that day.", "那一天人们吃饺子。"], ["练一练 · 第26–27页"], ["", "Write about the beginning of the four seasons and the weather.", "写一写四季的开始和天气。"], ["", "Make a card about a solar term.", "做一张关于节气的卡片。"], ["", "Talk about the solar term on the back of the card.", "在卡片背面介绍这个节气。"], ["", "Make a report about a solar term.", "做一个关于节气的报告。"], ["", "What solar term is it in this chart?", "这张图表里是哪个节气？"], ["", "What's the weather like?", "天气怎么样？"], ["", "What can people do in this solar term?", "这个节气人们可以做什么？"], ["", "Write down the temperature of a solar term.", "写下一个节气的温度。"], ["", "I can say the names of solar terms.", "我能说出节气的名称。"], ["", "I can talk about one of the solar terms.", "我能介绍其中一个节气。"], ["歌谣 · 第28页"], ["", "I see a sheep. I see a tree.", "我看见一只羊，我看见一棵树。"], ["", "The sheep is sleeping under the tree.", "羊在树下睡觉。"], ["", "I see three bees. I see my feet.", "我看见三只蜜蜂，我看见我的脚。"], ["", "The bees are dancing by my feet.", "蜜蜂在我脚边跳舞。"], ["", "I like to eat some meat.", "我喜欢吃点肉。"], ["", "My father likes to read.", "我爸爸喜欢读书。"], ["", "Come and drink some tea,", "来喝点茶吧，"], ["", "To feel the sand and sea!", "感受沙滩和大海！"]]},

"1":{"title": "Which One Do You Like Better?", "sentences": [["课文 · 第2页"], ["Sara", "What are you reading, Lingling?", "玲玲，你在读什么？"], ["Lingling", "I'm reading Journey to the West.", "我在读《西游记》。"], ["Lingling", "It's very famous in China.", "它在中国非常有名。"], ["Sara", "Really? What is it about?", "真的吗？它讲的是什么？"], ["Lingling", "It tells about a long and difficult journey to ancient India.", "它讲的是一次去古印度的漫长而艰难的旅程。"], ["Lingling", "I like Wukong the Monkey and Bajie the Pigsy in the story.", "我喜欢故事里的孙悟空和猪八戒。"], ["Sara", "It sounds interesting.", "听起来很有趣。"], ["Sara", "The Monkey or the Pigsy, who do you like better?", "猴子和猪八戒，你更喜欢谁？"], ["Lingling", "I like the Monkey better.", "我更喜欢猴子。"], ["Lingling", "He always has good ideas.", "他总是有好主意。"], ["Lingling", "What books do you like to read, Sara?", "萨拉，你喜欢读什么书？"], ["Sara", "I like Snow White and Around the World in Eighty Days.", "我喜欢《白雪公主》和《八十天环游地球》。"], ["Lingling", "Which one do you like better?", "你更喜欢哪一本？"], ["Sara", "I like Around the World in Eighty Days better because I like travelling.", "我更喜欢《八十天环游地球》，因为我喜欢旅行。"], ["Lingling", "I like it, too. It's a good book for children.", "我也喜欢，它是一本适合孩子的好书。"], ["练一练 · 第3页"], ["", "Lingling is reading Journey to the West.", "玲玲在读《西游记》。"], ["", "She likes the Monkey better in the book.", "她更喜欢书里的猴子。"], ["", "She likes him because he always has good ideas.", "她喜欢他，因为他总是有好主意。"], ["", "She likes this book because she likes travelling.", "她喜欢这本书，因为她喜欢旅行。"], ["", "I like Animal World better because it's interesting.", "我更喜欢《动物世界》，因为它很有趣。"], ["读书分享 · 第4页"], ["", "What books do you like to read?", "你喜欢读什么书？"], ["", "Please share your reading with your friends.", "请和朋友分享你读的书。"], ["", "How many books do you have?", "你有多少本书？"], ["", "How often do you read books?", "你多久读一次书？"], ["", "Story book or science book, which kind of book do you like to read better?", "故事书和科普书，你更喜欢读哪一种？"], ["", "What is your favourite book?", "你最喜欢的书是什么？"]]},
"2":{"title": "My Favourite Subject Is Maths", "sentences": [["课文 · 第5页"], ["Lingling", "Come and look. We have so many subjects.", "快来看，我们有这么多科目。"], ["Lingling", "They are Chinese, Maths, English, PE, Art, Music, Science and Calligraphy.", "有语文、数学、英语、体育、美术、音乐、科学和书法。"], ["Sara", "Great! Which subject do you like best, Lingling?", "太好了！玲玲，你最喜欢哪一科？"], ["Lingling", "I like Chinese best. It's beautiful and important.", "我最喜欢语文，它优美又重要。"], ["Sara", "What about you, Yangyang?", "洋洋，你呢？"], ["Yangyang", "I like PE best. I love sports.", "我最喜欢体育，我爱运动。"], ["Lingling", "What's your favourite subject, Sara?", "萨拉，你最喜欢的科目是什么？"], ["Sara", "My favourite subject is Maths. It's interesting and useful.", "我最喜欢的科目是数学，它有趣又有用。"], ["Yangyang", "Maths is difficult for me.", "数学对我来说很难。"], ["Sara", "Don't worry. We can study Maths together.", "别担心，我们可以一起学数学。"], ["Sara", "Look! Maomao is drawing over there.", "看！毛毛在那边画画。"], ["Lingling", "He likes drawing very much. And he does best in Art.", "他非常喜欢画画，而且他美术学得最好。"], ["练一练 · 第6–7页"], ["", "Which subject do you like best? Why?", "你最喜欢哪一科？为什么？"], ["", "Which subject do you do best in?", "你哪一科学得最好？"], ["", "Which subject do you have problems with?", "你哪一科有困难？"], ["", "I do best in it. I can help my friends with it.", "我这一科学得最好，我可以帮助朋友学它。"]]},
"3":{"title": "My Hobby Is Drawing", "sentences": [["课文 · 第8页"], ["Maomao", "Hi, I'm Maomao. My hobby is drawing.", "你好，我是毛毛。我的爱好是画画。"], ["Maomao", "I like drawing everything: plants, animals, my family and friends.", "我什么都喜欢画：植物、动物、我的家人和朋友。"], ["Maomao", "It helps me to see the beautiful world.", "它让我看到美丽的世界。"], ["Maomao", "I like drawing animals with big eyes.", "我喜欢画大眼睛的动物。"], ["Maomao", "I also like drawing children with smiling faces.", "我也喜欢画笑脸的孩子。"], ["Maomao", "Drawing makes me feel happy.", "画画让我感到快乐。"], ["Maomao", "At the weekend, I like to find a quiet place in the park and draw there.", "周末，我喜欢在公园里找个安静的地方画画。"], ["Maomao", "I like drawing trees, flowers, rivers and hills.", "我喜欢画树、花、河流和小山。"], ["Maomao", "In this way I get to know the beautiful nature.", "这样我就认识了美丽的大自然。"], ["Maomao", "I really enjoy drawing.", "我真的很喜欢画画。"], ["Maomao", "My mum's hobby is travelling.", "我妈妈的爱好是旅行。"], ["Maomao", "She always takes me to some interesting places.", "她总是带我去一些有趣的地方。"], ["Maomao", "My dad's hobby is cooking.", "我爸爸的爱好是做饭。"], ["Maomao", "He cooks delicious food for us every day.", "他每天给我们做好吃的。"], ["Maomao", "My friend Baobao likes watching films.", "我的朋友宝宝喜欢看电影。"], ["Maomao", "We often go to the cinema together.", "我们经常一起去电影院。"], ["练一练 · 第9–10页"], ["", "What are their hobbies?", "他们的爱好是什么？"], ["", "I like to go to parks to draw pictures of nature.", "我喜欢去公园画大自然。"], ["", "My mum likes travelling best.", "我妈妈最喜欢旅行。"], ["", "Which club do you like?", "你喜欢哪个俱乐部？"], ["", "I like the Art Club because I can draw in the club.", "我喜欢美术俱乐部，因为我可以在那里画画。"], ["", "Drawing is my hobby.", "画画是我的爱好。"]]},
"4":{"title": "I Like Chinese Kung Fu Best", "sentences": [["课文 · 第11页"], ["", "There is a Show and Tell in the class.", "班上有一次展示和讲述活动。"], ["Dongdong", "Hello! I'm Dongdong. I like cooking.", "你好！我是东东，我喜欢做饭。"], ["Dongdong", "I can cook chicken with potatoes.", "我会做土豆炖鸡。"], ["Dongdong", "I can also cook noodles.", "我还会煮面条。"], ["Yangyang", "Hi! I'm Yangyang. My favourite subject is PE.", "你好！我是洋洋，我最喜欢的科目是体育。"], ["Yangyang", "I like Chinese kung fu best. It makes me strong.", "我最喜欢中国功夫，它让我强壮。"], ["Yangyang", "Let me show you now.", "现在我来给你们表演。"], ["Tiantian", "Hello! I'm Tiantian. My hobby is dancing.", "你好！我是甜甜，我的爱好是跳舞。"], ["Tiantian", "I always have a good time when I dance.", "跳舞的时候我总是很开心。"], ["Tiantian", "I like folk dance best. It's beautiful.", "我最喜欢民族舞，它很美。"], ["Tiantian", "Now I will dance for you.", "现在我来为你们跳舞。"], ["Baobao", "Hi! I'm Baobao. I like calligraphy.", "你好！我是宝宝，我喜欢书法。"], ["Baobao", "I practice it every day.", "我每天都练习。"], ["Baobao", "Let me show you how to write the Chinese character Fu.", "我来给你们演示怎么写“福”字。"], ["练一练 · 第12–13页"], ["", "Dongdong can cook food by himself.", "东东会自己做饭。"], ["", "Baobao can write beautiful Chinese characters.", "宝宝会写漂亮的汉字。"], ["", "Yangyang does best in Chinese kung fu.", "洋洋中国功夫最好。"], ["", "Tiantian's folk dance is very beautiful.", "甜甜的民族舞非常美。"], ["", "Do a Show and Tell about your likes and hobbies.", "做一次关于你的喜好和爱好的展示。"], ["", "What are your hobbies?", "你的爱好是什么？"], ["", "How can you show your likes or hobbies to others?", "你怎样向别人展示你的喜好和爱好？"], ["", "Hello, everyone! I hope you'll like it. Thank you.", "大家好！希望你们喜欢，谢谢。"], ["", "I can say my hobbies and tell why I like them.", "我能说出我的爱好，并说明为什么喜欢。"], ["", "I can name my favourite book and subject, and tell the reasons.", "我能说出最喜欢的书和科目，并说明原因。"], ["歌谣 · 第14页"], ["", "I am May, and I want to say,", "我是梅，我想说，"], ["", "I always have a wonderful day.", "我每天都过得很精彩。"], ["", "I play the piano every day.", "我每天弹钢琴。"], ["", "It makes me happy all the way.", "它让我一路都很开心。"], ["", "I also like running on Saturday.", "我也喜欢星期六去跑步。"], ["", "I see some trains on my way.", "路上我看到一些火车。"], ["", "Sometimes here comes the rain.", "有时候下起雨来。"], ["", "I wait for a minute and run away.", "我等一会儿，然后跑开。"]]},
"5":{"title": "Mid-Autumn Festival for Getting Together", "sentences": [["课文 · 第16页"], ["Maomao", "Look at this Tang poem.", "看这首唐诗。"], ["Maomao", "It's about the Mid-Autumn Festival.", "它是关于中秋节的。"], ["Sara", "When is the Mid-Autumn Festival?", "中秋节是什么时候？"], ["Maomao", "It's on the fifteenth day of the eighth month in the Chinese calendar.", "在农历八月十五。"], ["Maomao", "It usually falls in the middle of autumn.", "它通常在秋天的中间。"], ["Sara", "What is the Mid-Autumn Festival for?", "中秋节是为了什么？"], ["Maomao", "It's a festival for families to get together.", "它是家人团聚的节日。"], ["Sara", "What do you do on this day?", "这一天你们做什么？"], ["Maomao", "We eat moon cakes and fruit, and we enjoy the full moon at night.", "我们吃月饼和水果，晚上赏圆月。"], ["Sara", "Are there any stories about this festival?", "这个节日有什么故事吗？"], ["Maomao", "Yes, the story of Chang'e Flying to the Moon is interesting.", "有，嫦娥奔月的故事很有趣。"], ["Maomao", "I'll tell you about it after school.", "放学后我讲给你听。"], ["练一练 · 第17页"], ["", "Sara wants to know the dates of some more Chinese festivals.", "萨拉想知道更多中国节日的日期。"], ["", "The Spring Festival is on the first day of the first month.", "春节在正月初一。"], ["", "The Lantern Festival is on the fifteenth day of the first month.", "元宵节在正月十五。"], ["", "The Dragon Boat Festival is on the fifth day of the fifth month.", "端午节在五月初五。"], ["写一写 · 第18页"], ["", "Write down the date of the Mid-Autumn Festival on the calendar.", "在日历上写下中秋节的日期。"], ["", "Tick the activities you want to do on the festival.", "勾出你在节日里想做的事。"], ["", "Have a big dinner and get together with the family.", "吃一顿大餐，和家人团聚。"], ["", "Make moon cakes and enjoy the full moon.", "做月饼，赏圆月。"], ["", "Make a festival card.", "做一张节日卡片。"]]},

}));

UNITS.forEach(u => u.words.forEach(w => {
  const re = new RegExp('\\b' + wpat(w.w) + '\\b', 'i'), out = [];
  const key = x => toks(x).slice(0, 3).map(t => t.t.toLowerCase()).join(' ');
  const cand = u.sentences.filter(x => re.test(x.en)).concat(UNITS.filter(v => v !== u).flatMap(v => v.sentences).filter(x => re.test(x.en)));
  for (const x of cand) { if (out.length >= 3) break; if (!out.some(y => key(y) === key(x))) out.push(x); }

}));

  if (inp) { inp.value = G.val || ''; G.shake = false; const fk = G.i + ':' + G.tries + ':' + G.hint; if (G.state === 'ask' && G.focused !== fk) { G.focused = fk; inp.focus(); } }
  const sayKey = ACT + ':' + (G.i ?? 0);
  if (G.spoke === sayKey) return;
  if (ACT === 'cards') { G.spoke = sayKey; speak(G.list[G.i].w); }
  if (ACT === 'quiz' && !G.answered) { const q = G.qs[G.i]; if (q.type !== 'cn2en') { G.spoke = sayKey; speak(q.ans.w); } }
  if (ACT === 'spell' && G.state === 'play') { G.spoke = sayKey; speak(G.list[G.i].w); }
}

/* ----- 2 听一听 选一选 ----- */
function makeQuiz(p, review, daily){
  const n = daily ? p.length : review ? Math.min(p.length * 2, 12) : Math.min(10, Math.max(p.length, 6));
  let seq = []; while (seq.length < n) seq = seq.concat(shuffle(p)); seq = seq.slice(0, n);
  const types = ['listen', 'en2cn', 'cn2en'];
  const qs = seq.map(w => {
    const others = shuffle(unitOf(w.u).words.filter(x => x.w !== w.w && x.cn !== w.cn)).slice(0, 3);
    return { type: types[Math.floor(Math.random() * 3)], ans: w, opts: shuffle([w, ...others]) };
  });
  return { qs, i: 0, correct: 0, answered: false, review, daily };
}
function vQuiz(){
  const q = G.qs[G.i], w = q.ans, n = G.qs.length; learn(w);
  let prompt = '';

  const opts = q.opts.map((o, j) => {
    let cls = 'opt';
    if (G.answered) { if (o === w) cls += ' right'; else if (j === G.picked) cls += ' wrong'; }
    const label = q.type === 'en2cn' ? esc(o.cn) : `<span class="word">${esc(o.w)}</span>`;
    return `<button class="${cls}" data-a="pick" data-i="${j}" ${G.answered ? 'disabled' : ''}>${label}</button>`;
  }).join('');
  let fb = '<p class="feedback">&nbsp;</p>';

function nextQ(){
  G.i++; G.answered = false; G.picked = null;
  if (G.i >= G.qs.length) finish('quiz', ratioStars(G.correct / G.qs.length), `答对 ${G.correct} / ${G.qs.length} 题`);
  else render();
}

/* ----- 3 拼一拼 ----- */
function initSpell(){
  const w = G.list[G.i];
  const letters = [...w.w].filter(c => /[A-Za-z0-9]/.test(c));
  let tiles = shuffle(letters);
  for (let k = 0; k < 6 && letters.length > 2 && tiles.join('') === letters.join(''); k++) tiles = shuffle(letters);
  Object.assign(G, { letters, slots: letters.map(() => null), tiles: tiles.map(ch => ({ ch, used: false })), tries: 0, hint: false, state: 'play', bad: null });
}
function vSpell(){
  const w = G.list[G.i]; learn(w);
  const longest = Math.max(...w.w.split(' ').map(x => x.length));
  let li = 0, slots = `<div class="slots" style="--n:${longest}"><div class="slot-group">`;
  for (const c of w.w) {
    if (c === ' ') { slots += '</div><div class="slot-group">'; continue; }
    if (!/[A-Za-z0-9]/.test(c)) { slots += `<span class="slot fixed">${esc(c)}</span>`; continue; }
    const t = G.slots[li];
    const cls = G.state !== 'play' ? 'ok' : (G.bad && G.bad[li] ? 'bad' : '');
    slots += `<button class="slot ${cls}" data-a="unslot" data-i="${li}" aria-label="第 ${li + 1} 个字母">${t === null ? '' : G.tiles[t].ch}</button>`;
    li++;
  }
  slots += '</div></div>';
  const tiles = G.tiles.map((t, i) => `<button class="tile ${t.used ? 'used' : ''}" data-a="tile" data-i="${i}" ${t.used || G.state !== 'play' ? 'tabindex="-1"' : ''}>${t.ch}</button>`).join('');
  let ctl;
  if (G.state === 'play') ctl = `<div class="row center"><button class="btn sm" data-a="shint">💡 提示</button><button class="btn sm" data-a="sclear">↺ 清空</button>${G.tries >= 2 ? '<button class="btn sm" data-a="sshow">看答案</button>' : ''}</div>`;
  else ctl = `${spHtml(w)}<p class="feedback ${G.state === 'right' ? 'ok' : 'no'}">${G.state === 'right' ? (G.tries === 0 && !G.hint ? '一次就拼对，太棒了！' : '拼对啦！') : '记住它，下次一定行'}</p><button class="btn primary" data-a="snext">${G.i === G.list.length - 1 ? '完成 ★' : '下一个 →'}</button>`;
  return `${actTop((G.i + 1) + ' / ' + G.list.length)}
  <div class="progress"><i style="width:${G.i / G.list.length * 100}%"></i></div>
  <div class="stage">
    <div class="q-emoji">${w.e}</div><div class="q-cn">${esc(w.cn)}</div>
    <div class="row center"><button class="btn sm sun" data-a="say" data-t="${esc(w.w)}">🔊 听</button><button class="btn sm" data-a="say" data-t="${esc(w.w)}" data-slow="1">🐢 慢</button></div>
    ${slots}
    ${G.state === 'play' ? `<div class="tiles">${tiles}</div>` : ''}
    ${ctl}
  </div>`;
}
function placeTile(i){
  if (G.state !== 'play' || G.tiles[i].used) return;
  const j = G.slots.indexOf(null); if (j < 0) return;
  G.slots[j] = i; G.tiles[i].used = true;
  if (G.slots.indexOf(null) < 0) checkSpell(); else render();
}
function freeSlot(j){ const t = G.slots[j]; if (t === null) return; G.tiles[t].used = false; G.slots[j] = null; }
function checkSpell(){
  const w = G.list[G.i];
  const guess = G.slots.map(t => G.tiles[t].ch);
  if (guess.join('') === G.letters.join('')) {
    G.state = 'right'; if (G.tries === 0 && !G.hint) { G.first++; okMiss(w.k); }
    tone(true); speak(w.w); render(); return;
  }
  G.tries++; if (G.tries === 1) addMiss(w.k);
  tone(false); G.bad = guess.map((c, j) => c !== G.letters[j]); render();
  const g = G;
  setTimeout(() => { if (G !== g || G.state !== 'play') return; G.bad.forEach((b, j) => { if (b) freeSlot(j); }); G.bad = null; render(); }, 750);
}
function spellHint(){
  if (G.state !== 'play') return;
  G.hint = true;

  G.tries++; tone(false); G.bad = guess.map((t, j) => t !== G.toks[j]); render();
  const g = G;
  setTimeout(() => { if (G !== g || G.state !== 'play') return;
    let keep = 0; while (keep < G.line.length && !G.bad[keep]) keep++;
    G.line.slice(keep).forEach(bi => G.bank[bi].used = false); G.line = G.line.slice(0, keep); G.bad = null; render(); }, 800);
}
function orderShow(){
  G.bank.forEach(b => b.used = false);
  G.line = G.toks.map(t => { const bi = G.bank.findIndex(b => !b.used && b.t === t); G.bank[bi].used = true; return bi; });
  G.state = 'shown'; speak(G.list[G.i].en); render();
}

/* ----- 结果页 ----- */
function vResult(){
  const msg = ['再来一次就会更好！', '继续加油！', '不错哦！', '太棒了！'][R.stars];
  return `<div class="topbar">${R.daily ? '<button class="btn sm" data-a="home">← 营地</button>' : R.review ? '<button class="btn sm" data-a="miss">← 错题本</button>' : `<button class="btn sm" data-a="back">← ${uname(U)}</button>`}</div>
  <div class="stage result">
    <div class="big-stars">${[0,1,2].map(i => `<span class="${i < R.stars ? 'on' : 'off'}">★</span>`).join('')}</div>
    <h2 style="font-size:34px">${msg}</h2>
    <p class="muted" style="margin:0">${esc(R.detail || '')}</p>
    ${R.sticker ? `<p class="new-sticker">解锁新贴纸 ${R.sticker}</p>` : ''}
    <div class="row center">
      ${R.daily ? '<button class="btn primary" data-a="home">回到营地</button>' : R.review ? '<button class="btn primary" data-a="miss">回错题本</button>' : (() => { const AS = actsFor(U), nx = AS[AS.findIndex(a => a.id === R.id) + 1];
        return `<button class="btn" data-a="act" data-act="${R.id}">再玩一次</button>` + (nx ? `<button class="btn primary" data-a="act" data-act="${nx.id}">下一站：${nx.name} →</button>` : `<button class="btn primary" data-a="back">回到 ${uname(U)}</button>`); })()}
    </div>
    ${!R.review && !R.daily && actsFor(U)[actsFor(U).length - 1].id !== R.id ? `<button class="link" data-a="back">回到 ${uname(U)}</button>` : ''}
  </div>`;
}

/* ----- 错题本 ----- */
function vMiss(){
  const list = allWords().filter(w => S.miss[w.k]).sort((a, b) => S.miss[b.k].n - S.miss[a.k].n);
  const body = list.length ? `<ul class="mlist">${list.map(w => `<li class="mitem"><span class="e">${w.e}</span>
      <span><span class="word">${esc(w.w)}</span><small>${esc(w.cn)} · Lesson ${w.u}</small></span>
      <span class="miss-n">错 ${S.miss[w.k].n} 次</span>
      <button class="icon-btn" data-a="say" data-t="${esc(w.w)}" aria-label="朗读 ${esc(w.w)}">🔊</button></li>`).join('')}</ul>
      <button class="btn primary" data-a="mreview">开始复习 ${list.length} 个单词</button>`
    : `<div class="empty"><div class="big">🎉</div><p>错题本是空的。</p></div>`;
  return `<div class="topbar"><button class="btn sm" data-a="home">← 营地</button><span class="title">错题本</span></div>
  <p class="muted" style="margin:0">做题时答错的单词会自动收进来。复习时连续答对 2 次，它就会离开错题本。</p>
  ${body}`;
}

/* ===== 点击处理 ===== */
const H = {
  home: () => go('home'),
  unit: el => go('unit', unitOf(el.dataset.u)),
  back: () => go('unit'),
  miss: () => go('miss'),
  act: el => startAct(el.dataset.act),
  core: el => { S.coreOnly = el.dataset.v === '1'; save(); render(); },
  sound: () => { S.sound = !S.sound; save(); render(); },
  say: el => speak(el.dataset.t, el.dataset.slow === '1'),
  setcore: () => { S.coreOnly = !S.coreOnly; save(); render(); },
  setshuf: () => { S.shuffle = !S.shuffle; save(); render(); },
  mixtog: el => { const id = +el.dataset.u; let sel = mixSel(); sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id).sort((a, b) => a - b); S.mixSel = sel; save(); render(); },
  mixall: () => { S.mixSel = mixSel().length === UNITS.length ? [] : UNITS.map(u => u.id); save(); render(); },
  mixgo: () => { if (mixSel().length) go('unit', mixUnit()); },
  omode: el => { S.orderPaper = el.dataset.v === '1'; save(); initOrder(); render(); },
  oreveal: () => { G.state = 'reveal'; speak(G.list[G.i].en); render(); },
  oself: el => { if (el.dataset.ok === '1') { G.state = 'right'; G.first++; tone(true); } else { G.state = 'wrong'; tone(false); } render(); },
  // cards
  flip: () => {
    const f = document.querySelector('.flash-inner'); if (!f) return;
    const w = G.list[G.i], ex = w.exS, mean = f.querySelector('.mean'), more = f.querySelector('.tap-more');
    if (G.face === 0) { f.classList.add('is-flipped'); G.face = ex ? 1 : 2; if (ex) speak(ex.tts || ex.en); }
    else if (G.face === 1) { mean.hidden = false; if (more) more.hidden = true; G.face = 2; }
    else { f.classList.remove('is-flipped'); G.face = 0; if (ex) setTimeout(() => { if (G.face === 0) { mean.hidden = true; if (more) more.hidden = false; } }, 450); }
  },
  cprev: () => { if (G.i > 0) { G.i--; render(); } },
  cnext: () => { if (G.i < G.list.length - 1) { G.i++; render(); } else finish('cards', 3, `看完 ${G.list.length} 张卡片`); },
  // quiz
  pick: el => {
    if (G.answered) return;
    const j = +el.dataset.i, q = G.qs[G.i];
    G.answered = true; G.picked = j; G.lastOk = q.opts[j] === q.ans;
    if (G.lastOk) { G.correct++; okMiss(q.ans.k); if (G.daily) srsUp(q.ans.k); tone(true); if (q.type === 'cn2en') speak(q.ans.w); }
    else { addMiss(q.ans.k); tone(false); }
    render();
    if (G.lastOk) { const g = G, i = G.i; setTimeout(() => { if (G === g && G.i === i && view === 'act') nextQ(); }, 1100); }
  },
  qnext: () => nextQ(),
  // spell
  tile: el => placeTile(+el.dataset.i),
  unslot: el => { if (G.state !== 'play') return; freeSlot(+el.dataset.i); render(); },
  shint: () => spellHint(),
  sclear: () => { if (G.state !== 'play') return; G.slots.forEach((t, j) => freeSlot(j)); render(); },
  sshow: () => spellShow(),
  snext: () => { G.i++; if (G.i >= G.list.length) finish('spell', ratioStars(G.first / G.list.length), `一次拼对 ${G.first} / ${G.list.length} 个`); else { initSpell(); render(); } },
  // dictation
  dhint: () => { if (G.state !== 'ask') return; const inp = document.getElementById('dict-in'); if (inp) G.val = inp.value; G.hint = Math.min(G.hint + 1, G.list[G.i].w.length); render(); },
  dgive: () => { if (G.state !== 'ask') return; const w = G.list[G.i]; if (G.tries === 0) addMiss(w.k); G.state = 'wrong'; tone(false); speak(w.w); render(); },
  dreveal: () => { G.state = 'reveal'; if (G.dir === 'ce') speak(G.list[G.i].w); render(); },
  dself: el => { const w = G.list[G.i]; if (el.dataset.ok === '1') { G.state = 'right'; G.right++; G.first++; okMiss(w.k); tone(true); } else { G.state = 'wrong'; addMiss(w.k); tone(false); } render(); },
  dnext: () => dictNext(),
  dmode: el => { S.dictPaper = el.dataset.v === '1'; save(); resetDict(); render(); },
  // fill
  fpick: el => {
    if (G.answered) return;
    const j = +el.dataset.i, it = G.items[G.i];
    G.answered = true; G.picked = j; G.lastOk = it.opts[j] === it.ans;
    if (G.lastOk) { G.correct++; okMiss(it.w.k); tone(true); } else { addMiss(it.w.k); tone(false); }
    render(); speak(it.s.tts || it.s.en);
    if (G.lastOk) { const g = G, i = G.i; setTimeout(() => { if (G === g && G.i === i && view === 'act') fillNext(); }, 2600); }
  },
  fnext: () => fillNext(),
  // read
  rsay: el => readSay(+el.dataset.i, el.dataset.slow === '1'),
  rcn: () => { G.showCn = !G.showCn; G.cn = {}; render(); },
  rrev: el => { const i = +el.dataset.i; G.rev[i] = true; readSay(i, false); render(); },
  rword: el => readWord(+el.dataset.i, +el.dataset.ti),
  mixunit: el => { const n = +el.dataset.n; S.mixSel = UNITS.filter(u => u.unit === n).map(u => u.id); save(); render(); },
  rcn1: el => { const i = +el.dataset.i; if (G.showCn) { G.showCn = false; SENT.forEach(x => G.cn[x.id] = true); } G.cn[i] = !G.cn[i]; render(); },
  rtab: el => { G.mode = el.dataset.v; G.rev = {}; stopSpeech(); render(); scrollTo(0, 0); },
  rsaytog: () => { G.say = !G.say; G.rev = {}; stopSpeech(); render(); },
  wshuf: () => { G.wl = shuffle(G.wl); G.wi = 0; G.rev = {}; stopSpeech(); render(); toast('已打乱单词顺序'); },
  wprev: () => { if (G.wi > 0) { G.wi--; G.rev = {}; stopSpeech(); render(); scrollTo(0, 0); } },
  wnext: () => { stopSpeech(); if (G.wi < G.wl.length - 1) { G.wi++; G.rev = {}; render(); scrollTo(0, 0); }
    else { const ids = [...new Set(G.wl.flatMap(w => w.rs.map(x => x.id)))], h = ids.filter(id => S.read['s' + id]).length;
      finish('read', ratioStars(h / ids.length), `${G.wl.length} 个单词，听过 ${h} / ${ids.length} 个句子` + (h < ids.length ? '。每句都点 ▶ 听一遍，就能拿满 3 颗星' : '')); } },
  rall: () => readAll(),
  // order
  obank: el => { const i = +el.dataset.i; if (G.state !== 'play' || G.bank[i].used) return; G.bank[i].used = true; G.line.push(i); if (G.line.length === G.toks.length) checkOrder(); else render(); },
  oline: el => { if (G.state !== 'play') return; const j = +el.dataset.i; G.bank[G.line[j]].used = false; G.line.splice(j, 1); render(); },
  oclear: () => { if (G.state !== 'play') return; G.bank.forEach(b => b.used = false); G.line = []; render(); },
  oshow: () => orderShow(),
  onext: () => { G.i++; if (G.i >= G.list.length) finish('order', ratioStars(G.first / G.list.length), `做对 ${G.first} / ${G.list.length} 句` + (G.more ? '。再玩一次会换下一组句子' : '')); else { initOrder(); render(); } },
  // mistakes
  mreview: () => startAct('quiz', true),
  daily: () => { if (dueList().length) startAct('quiz', 'daily'); },
};
$app.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'dict-form') dictCheck(); });
$app.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || !$app.contains(el)) return; const f = H[el.dataset.a]; if (f) f(el); });

render();
</script>

</body>
